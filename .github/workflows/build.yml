name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test -v q --nologo
      - run: dotnet publish src/EchoScan.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
      - shell: pwsh
        run: (Get-FileHash dist/EchoScan.exe -Algorithm SHA256).Hash | Tee-Object -FilePath dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EchoScan
          path: dist/*